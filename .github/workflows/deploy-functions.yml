name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: pjlygfpltmkbvmkenfku
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy all edge functions
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is missing (GitHub → Settings → Secrets and variables → Actions)"
            exit 1
          fi
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            echo "Deploying $fn ..."
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt
          done
