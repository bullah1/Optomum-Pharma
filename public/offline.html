<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>অফলাইন — Optimum Pharmaceuticals HLB</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: hsl(170, 20%, 97%);
      color: hsl(180, 20%, 12%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
      -webkit-user-select: none;
      user-select: none;
    }
    @media (prefers-color-scheme: dark) {
      body { background: hsl(180, 18%, 7%); color: hsl(170, 12%, 93%); }
      .card { background: hsl(180, 18%, 10%); }
      .icon-circle { background: hsl(180, 15%, 16%); }
      .retry-btn { background: #F8931D; }
      .subtle { color: hsl(170, 8%, 55%); }
    }
    .card {
      background: #fff;
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 2px 15px -3px rgba(0,0,0,0.06), 0 1px 4px -2px rgba(0,0,0,0.04);
    }
    .icon-circle {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: hsl(170, 18%, 94%);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      animation: pulse-ring 2s ease-in-out infinite;
    }
    .icon-circle svg { width: 36px; height: 36px; color: #F8931D; }
    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
    }
    .brand-logo {
      width: 36px; height: 36px;
      border-radius: 0.75rem;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: 700;
      font-size: 0.8rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .brand-name { font-size: 1.25rem; font-weight: 700; color: #F8931D; }
    h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; }
    .subtle { color: hsl(170, 8%, 48%); font-size: 0.875rem; line-height: 1.5; margin-bottom: 1.75rem; }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #F8931D;
      color: #fff;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 1rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.15s;
    }
    .retry-btn:active { transform: scale(0.96); opacity: 0.8; }
    .retry-btn svg { width: 18px; height: 18px; }
    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 0 0 hsla(32, 94%, 54%, 0.15); }
      50% { box-shadow: 0 0 0 16px hsla(32, 94%, 54%, 0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="/images/optimum-mark.png" alt="" width="40" height="40" />
      <span class="brand-name">Optimum Pharmaceuticals HLB</span>
    </div>

    <div class="icon-circle">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.288 15.038a5.25 5.25 0 017.424 0M5.106 11.856c3.807-3.808 9.98-3.808 13.788 0M1.924 8.674c5.565-5.565 14.587-5.565 20.152 0" />
        <line x1="3" y1="3" x2="21" y2="21" stroke-linecap="round" stroke-width="2" />
      </svg>
    </div>

    <h2>No Internet Connection</h2>
    <p class="subtle">Your device is not connected to the internet. Please check your Wi-Fi or mobile data.</p>

    <button class="retry-btn" onclick="window.location.reload()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182" />
      </svg>
      Try Again
    </button>
  </div>
</body>
</html>
